quarkus.application.name=ef-quarkus-reservas

# --- Reactive datasource (Hibernate Reactive Panache, Mutiny) ---
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# dev/test: no explicit URL below on purpose, Quarkus Dev Services provisions
# an ephemeral Postgres container automatically (requires a running Docker).
%dev.quarkus.hibernate-orm.log.sql=true

# prod (packaged jar/native run, docker-compose): explicit connection, driven
# by environment variables.
%prod.quarkus.datasource.username=${DB_USERNAME:reservas}
%prod.quarkus.datasource.password=${DB_PASSWORD:reservas}
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservas}
# Blocking JDBC datasource, used only by Flyway (no reactive driver support).
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservas}

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# --- Structured JSON logging (see com.mitocode.shared.logging filters) ---
quarkus.log.console.json=true

%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false
